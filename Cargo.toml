[package]
name = "mealplan"
version = "0.1.0"
edition = "2021"
description = "Weekly meal planning as a constraint program: meals composed from ingredients under nutritional, time and wastage constraints."
license = "MIT"
repository = "https://github.com/lemmih/mealplan"

[features]
default = []
# OR-Tools CP-SAT backend. Requires a native OR-Tools install (e.g. `brew install or-tools`)
# and, with recent OR-Tools, `RUSTFLAGS='-Clink-arg=-lprotobuf'`. See README.
cpsat = ["dep:cp_sat"]
# MIP fallback via good_lp with the HiGHS backend (built from source, no system deps).
mip = ["dep:good_lp"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
toml = "0.8"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

cp_sat = { version = "0.4.1", optional = true }
good_lp = { version = "1.15", optional = true, default-features = false, features = ["highs"] }
